[project]
name = "gerenciador-tarefas-cli"
version = "0.1.0"
description = "Gerenciador de tarefas local (CLI) com persistência em JSON"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
